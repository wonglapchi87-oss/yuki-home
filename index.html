<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Yuki · 新家 Move-in</title><style>
:root{--bg:#f6f7f9;--ink:#1f2933;--mut:#66727f;--acc:#1f6f8b;--line:#e3e7ec;--ok:#2f7d4f;--warn:#b26a00}
*{box-sizing:border-box}body{margin:0;font:17px/1.6 -apple-system,system-ui,"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:auto;padding:0 14px 60px}
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate input{font-size:20px;padding:14px;border-radius:12px;border:1px solid #cfd6de;width:100%;max-width:320px;text-align:center}
.gate button{margin-top:14px;font-size:18px;padding:12px 30px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.err{color:#b00020;min-height:1.5em;margin-top:8px}
.hero{background:var(--acc);color:#fff;margin:0 -14px;padding:22px 18px 18px}
.hero h1{margin:4px 0 0;font-size:26px}.hero p{margin:2px 0;opacity:.92;font-size:15px}.tag{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:1px}
.hero .tl a{color:#fff;font-weight:600;font-size:14px}
.mvsub{color:var(--mut);font-size:15px;margin:14px 0 8px}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 12px}.bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#ptxt{font-size:14px;color:var(--mut);font-weight:600;min-width:56px;text-align:right}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dates div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.dates b{display:block;font-size:14px;color:var(--acc)}.dates span{font-size:13px;color:var(--mut);line-height:1.35;display:block}
.mvnav{display:flex;gap:6px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2;margin:0 -14px;padding-left:14px;padding-right:14px}
.mvnav a{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px 12px;color:var(--ink);text-decoration:none;font-size:14px}
.grp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;scroll-margin-top:60px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.gh h3{margin:0;font-size:18px}.pill{font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px;background:#eef1f4;color:var(--mut);white-space:nowrap}
.pill.wait{background:#fff1dc;color:var(--warn)}.pill.due{background:#e3eff5;color:var(--acc)}.pill.ref{background:#efe9f8;color:#5b3a99}.pill.okp{background:#e3f3e8;color:var(--ok)}
.gnote{font-size:14px;color:var(--warn);margin:6px 0}.gsub{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 0}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0f2f5;cursor:pointer}
.ckrow .ck{border-bottom:0;padding-bottom:4px}.ckrow{border-bottom:1px solid #f0f2f5;padding-bottom:8px}
.ck input{appearance:none;-webkit-appearance:none;flex:0 0 26px;width:26px;height:26px;border:2px solid #b8c2cc;border-radius:7px;margin:1px 0 0;background:#fff;display:grid;place-content:center}
.ck input:checked{background:var(--ok);border-color:var(--ok)}.ck input:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck input:checked+span{color:var(--mut);text-decoration:line-through;text-decoration-color:#9aa5b1}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding-left:38px}
.btn2{display:inline-block;font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:10px;border:1px solid #c9dbe3;background:#eef6f9;color:var(--acc);text-decoration:none;cursor:pointer}
.refnote{background:#fff7e6;border-left:4px solid #e0a030;border-radius:8px;padding:8px 10px;font-size:14px}
.tr{border-top:1px solid #f0f2f5;padding:10px 0}.trh b{font-size:16px}.trh span{display:block;font-size:13px;color:var(--mut)}
.tr ul,.okl{margin:6px 0;padding-left:20px}.tr li,.okl li{margin:3px 0}.tr .acts{padding-left:0}
code{font-size:16px;background:#f0f2f5;padding:2px 6px;border-radius:6px}
.tbc{color:#a0662c;font-style:italic}.small{font-size:13px;color:var(--mut)}.foot{margin-top:20px}.foot .btn2{margin-left:6px;font-size:13px;padding:4px 10px}
.okg{border-color:#cfe8d7}a{color:var(--acc)}
@media(max-width:380px){.dates{grid-template-columns:1fr}}
</style></head><body>

async function dec(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.i)},key,u(P.c)));}
function ld(){try{return JSON.parse(localStorage.getItem(SK)||"{}")}catch(e){return{}}}
function prog(){const b=[...document.querySelectorAll(".ck input")],n=b.filter(x=>x.checked).length;
const t=document.getElementById("ptxt"),p=document.getElementById("pbar");if(t)t.textContent=n+" / "+b.length;if(p)p.style.width=(b.length?100*n/b.length:0)+"%";}
function init(){const st=ld();document.querySelectorAll(".ck input").forEach(x=>{x.checked=!!st[x.dataset.k];
x.addEventListener("change",()=>{const s=ld();if(x.checked)s[x.dataset.k]=Date.now();else delete s[x.dataset.k];localStorage.setItem(SK,JSON.stringify(s));prog();});});prog();
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const v=b.dataset.copy;try{await navigator.clipboard.writeText(v)}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("wx"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy")}
const o=b.textContent;b.textContent="已复制 Copied";setTimeout(()=>b.textContent=o,1500);});
const r=document.getElementById("rst");if(r)r.onclick=()=>{if(confirm("清除所有打勾？Clear all ticks?")){localStorage.removeItem(SK);init()}};}
async function tryPw(pw,quiet){try{const h=await dec(pw);document.getElementById("app").innerHTML=h;sessionStorage.setItem("ykh",pw);init();}
catch(e){if(!quiet)document.getElementById("err").textContent="密码不对 Wrong password";}}
document.getElementById("go").onclick=()=>tryPw(document.getElementById("pw").value);
document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")tryPw(e.target.value)};
const s=sessionStorage.getItem("ykh");if(s)tryPw(s,true);
</script></body></html>
